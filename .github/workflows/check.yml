name: Read-only check

on:
  push:
    branches: [main]
  pull_request:

# The job can read the code and nothing else: no writes, no secrets.
permissions:
  contents: read

jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Scripts are read only and match SHA256SUMS.txt
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tests\check-readonly.ps1
